; Code 33 settings - keep this file next to Code33.exe
; Passwords are NOT stored here (the app asks once and saves them in Windows Credential Manager)

[crm]
url = https://CRM-ADDRESS/crm
; msedge = the Edge already installed on the PC (use "chrome" for Chrome)
browser_channel = msedge
timeout_ms = 30000
; CSS selector of the CRM search box - check with F12 / playwright codegen
search_selector = input[type="search"], input[name*="search" i], input[id*="search" i]
; Leave the 3 login selectors empty if you log in manually/SSO - the login is remembered
login_user =
login_user_selector =
login_password_selector =
login_button_selector =
sims_section_text = SIMS INVENTORY
edit_text = עריכה
; text of the save button in the edit form (empty = the dropdown saves by itself)
save_text = שמור
status_in_use = בשימוש
status_suspended = מושהה

[ssh]
host = SSH-HOST-IP
port = 22
user = root
shell_prompt = [#$>]\s*$

[telnet]
host = TELNET-HOST-IP
port = 8023
user = TELNET-USER
login_prompt = (?i)(login|user(code|name)?)\s*:\s*$
password_prompt = (?i)password\s*:\s*$
; MML prompt of the CUDB (Ericsson usually shows "<")
mml_prompt = (^|\n)\s*<\s*$
exit_command = exit;

[run]
repeat = 3
command_timeout = 30
impi_realm = ims.mnc009.mcc425.3gppnetwork.org
