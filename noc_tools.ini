; NOC Tools settings (Code 33 + Code 13) - keep this file next to NOCTools.exe / noc_tools_app.py
; Passwords are NOT stored here (the app asks once and saves them in Windows Credential Manager)

[crm]
url = http://10.21.2.10/index.php
; search results page ({query} = the 05X number)
search_url = http://10.21.2.10/index.php?action=UnifiedSearch&module=Home&query_string={query}
browser_channel = msedge
timeout_ms = 30000
search_selector = input[name="query_string"]:visible
; yes = each person types their CRM username + password once, then NOC Tools logs in by itself
remember_login = yes
; login page fields (empty = the standard SuiteCRM login page)
login_user_selector =
login_password_selector =
login_button_selector =
sims_section_text = SIMS INVENTORY
edit_text = עריכה
save_text = שמור
status_in_use = בשימוש
status_suspended = מושהה

; --- code 13
; the line's SIMS INVENTORY table
sims_table_selector = table:has(#subs_mobile_inven_sims_search)
; button that opens the SIM-choosing window
select_text = בחר
; filter button inside that window
filter_text = מסנן
; field in the edit form whose X removes the SIM from the line
mobile_sub_label = Mobile Subscription
; button that shows CONNECTED / Code: 13
net_status_text = סטטוס מנוי ברשת
; button that closes that window
close_text = סגירה

[ssh]
host = 10.11.18.75
port = 22
user = root
shell_prompt = [#$>]\s*$

[telnet]
host = 10.11.18.75
port = 8023
user = cai3guser
login_prompt = (?i)(login( as)?|user(code|name)?)\s*:\s*$
password_prompt = (?i)password\s*:\s*$
mml_prompt = [\r\n][\w.\-]*>\s*$
exit_command = exit;

[run]
repeat = 3
; seconds to wait for each command's final result (after ORDERED)
result_timeout = 30
; pause between commands
command_delay = 0.3
; when the CUDB is busy (fault 1093/1098): retries and seconds between them
busy_retries = 5
busy_wait = 3
impi_realm = ims.mnc009.mcc425.3gppnetwork.org
stop_after_busy_commands = 3